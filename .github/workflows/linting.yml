---
# To debug locally:
#   npm install -g act
#   act pull_release -j overcommit

name: Linting

on:
  workflow_dispatch: {}
  pull_request:
    branches: ['*']
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  pull-requests: write
  contents: read

jobs:
  overcommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        # Number of commits to fetch. 0 indicates all history for all branches and tags.
        with:
          fetch-depth: 0

      - name: Install libjitterentropy.a for rugged
        # Ubuntu 26.04's libcrypto.pc links it statically
        run: |
          if pkg-config --libs --static libcrypto | grep -q jitterentropy; then
            sudo apt-get update && sudo apt-get install -y libjitterentropy3-dev
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          cache-version: 2026-01-11

      - name: Update to best available RBS
        run: |
          # Add optional gem to be able to typecheck related code
          echo "gem 'vernier', '>1.0', '<2'" >> .Gemfile
          bundle install

      - name: Cache gem yardocs
        uses: actions/cache@v4
        with:
          # Only the yardoc subtree: its path embeds each gem name and version, so a
          # restored entry is either correct or never looked up, and a prefix hit is
          # safe. The sibling .ser pins are keyed on Solargraph::VERSION, which is
          # identical across commits, so carrying those would serve pins built by
          # different lib/ code.
          #
          # github.job and the matrix Ruby version are in the key so jobs sharing one gem
          # set do not race to reserve the same entry and fail to save.
          path: ~/.cache/solargraph/yard-*
          key: sg-yard-${{ runner.os }}-${{ github.job }}-${{ matrix.ruby-version }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            sg-yard-${{ runner.os }}-${{ github.job }}-
            sg-yard-${{ runner.os }}-

      - name: Install gem types
        run: bundle exec rbs collection install

      - name: Overcommit
        run: |
          bundle exec overcommit --sign
          SOLARGRAPH_ASSERTS=on bundle exec overcommit --run --diff origin/master
  rubocop:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install libjitterentropy.a for rugged
        # Ubuntu 26.04's libcrypto.pc links it statically
        run: |
          if pkg-config --libs --static libcrypto | grep -q jitterentropy; then
            sudo apt-get update && sudo apt-get install -y libjitterentropy3-dev
          fi
      - uses: ruby/setup-ruby@1a615958ad9d422dd932dc1d5823942ee002799f # v1.227.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: reviewdog/action-rubocop@fcb74ba274da10b18d038d0bcddaae3518739634 # v2.21.2
        with:
          reporter: github-pr-check
          skip_install: true
          use_bundler: true
          rubocop_extensions: 'rubocop-rspec:gemfile rubocop-rake:gemfile rubocop-yard:gemfile'
          rubocop_flags: '-c .rubocop.yml'
          fail_level: info
          rubocop_version: Gemfile
          level: info
  rbs_validate:
    name: rbs validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install libjitterentropy.a for rugged
      # Ubuntu 26.04's libcrypto.pc links it statically
      run: |
        if pkg-config --libs --static libcrypto | grep -q jitterentropy; then
          sudo apt-get update && sudo apt-get install -y libjitterentropy3-dev
        fi
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4
        bundler-cache: true

    - name: Install gems
      run: bundle install

    - name: Run rbs validate
      run: bundle exec rbs validate
  rubocop_todo:
    name: .rubocop_todo.yml
    runs-on: ubuntu-latest
    # Needed only so the auto-update step (push-to-master only, below) can
    # push a commit back to the branch it checked out.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
    - name: Install libjitterentropy.a for rugged
      # Ubuntu 26.04's libcrypto.pc links it statically
      run: |
        if pkg-config --libs --static libcrypto | grep -q jitterentropy; then
          sudo apt-get update && sudo apt-get install -y libjitterentropy3-dev
        fi
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4
        bundler-cache: true

    - name: Install gems
      run: bundle install

    - name: Run RuboCop
      run: bundle exec rubocop -c .rubocop.yml

    # Diffs here can only be a shrink: "Run RuboCop" above already
    # confirmed no new offenses exist against .rubocop_todo.yml.
    - name: Auto-update .rubocop_todo.yml
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      continue-on-error: true
      run: |
        cmd="bundle exec rubocop --auto-gen-config --exclude-limit=5 --no-offense-counts --no-auto-gen-timestamp"
        ${cmd:?} || true
        if [ -n "$(git status --porcelain -- .rubocop_todo.yml)" ]
        then
          git diff -u -- .rubocop_todo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rubocop_todo.yml
          git commit -m "Auto-update .rubocop_todo.yml [skip ci]"
          git push origin HEAD:master
        else
          echo "No .rubocop_todo.yml cleanup needed."
        fi
